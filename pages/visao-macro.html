<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visão macro</title>
  <link rel="stylesheet" href="../css/listagem.css?v=tab1" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <style>
    .content{margin-left:220px;padding:28px 32px;min-height:100vh;background:var(--bg);overflow:auto;flex:1;min-width:0}
    .vm-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .vm-top h2{font-size:18px;font-weight:600;color:var(--text);margin-right:auto}
    .vm-info{font-size:12px;color:var(--text-muted)}
    .vm-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
    .vm-bar select,.vm-bar input{height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;font:inherit;font-size:13px;color:var(--text)}
    .vm-bar input{width:220px}
    .vm-seg{display:inline-flex;background:#e2e8f0;border-radius:9px;padding:3px;gap:2px}
    .vm-seg button{border:none;background:none;height:28px;padding:0 12px;border-radius:7px;font:inherit;font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer}
    .vm-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
    .vm-chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;color:var(--text-muted);cursor:pointer}
    .vm-chip b{font-weight:600;margin-left:4px;color:var(--text)}
    .vm-chip.on{border-color:var(--text);color:var(--text)}
    .vm-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
    .vm-kpis div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
    .vm-kpis span{display:block;font-size:12px;color:var(--text-muted)}
    .vm-kpis b{display:block;font-size:22px;font-weight:600;color:var(--text);margin-top:2px}
    .vm-kpis small{font-size:11px;color:var(--text-muted)}
    #vm-corpo{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 16px 14px}
    .vm-cab,.vm-row{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}
    .vm-track{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px;align-items:center}
    .vm-hd span{font-size:10.5px;color:var(--text-muted);writing-mode:vertical-rl;transform:rotate(180deg);height:118px;white-space:nowrap;justify-self:center;line-height:1}
    .vm-cab{position:sticky;top:0;background:var(--surface);z-index:2;padding:8px 0 6px;border-bottom:1px solid var(--border)}
    .vm-row{padding:11px 4px;border-bottom:1px solid #f1f5f9;cursor:pointer}
    .vm-row:hover,.vm-row.aberto{background:#f8fafc}
    .vm-track i{display:block;height:11px;border-radius:3px;background:#e2e8f0}
    .vm-track i.pulada,.vm-leg i.pulada{background:repeating-linear-gradient(135deg,#cbd5e1 0 2px,#f1f5f9 2px 5px)}
    .vm-tit{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .vm-sub{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vm-atual{font-size:12px;color:var(--text-muted);margin-top:7px}
    .vm-atual b{font-weight:600;color:var(--text)}
    .vm-tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px}
    .t-atrasado{background:#fef2f2;color:#b91c1c}.t-parado{background:#fffbeb;color:#b45309}.t-prazo{background:#eff6ff;color:#1d4ed8}.t-fim{background:#f0fdf4;color:#166534}
    .vm-leg{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--text-muted);padding:14px 4px 2px}
    .vm-leg i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
    .vm-det{grid-column:1/-1;margin:0 0 10px 0;padding:12px 16px 14px;background:#f8fafc;border-bottom:1px solid var(--border);cursor:default}
    .vm-links{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
    .vm-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font:inherit;font-size:12px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer}
    .vm-btn:hover{border-color:var(--text)}
    .vm-btn .material-icons-outlined{font-size:16px}
    .vm-m{font-size:12px;color:var(--text-muted)}
    .vm-tb{width:100%;max-width:760px;border-collapse:collapse;font-size:12.5px}
    .vm-tb th{text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);padding:5px 8px;border-bottom:1px solid var(--border);background:transparent;text-transform:none;letter-spacing:0;position:static}
    .vm-tb td{padding:5px 8px;border-bottom:1px solid #eef2f7;color:var(--text)}
    .vm-tb .n{text-align:right;white-space:nowrap}.vm-tb td.m{color:var(--text-muted);font-size:11.5px}
    .vm-tb tr.vazia td{color:#cbd5e1}.vm-tb tr.atual td{font-weight:600;background:#eff6ff}
    .vm-kb{display:grid;grid-auto-flow:column;grid-auto-columns:190px;gap:10px;overflow-x:auto;padding:10px 0 6px}
    .vm-col{background:#f8fafc;border-radius:10px;padding:8px;min-height:140px}
    .vm-col h4{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;color:var(--text-muted);margin:2px 2px 8px}
    .vm-col h4 b{color:var(--text)}
    .vm-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:pointer}
    .vm-card.c-atrasado{border-left:3px solid #E24B4A;border-radius:0 8px 8px 0}.vm-card.c-parado{border-left:3px solid #EF9F27;border-radius:0 8px 8px 0}
    .vm-vazio{padding:40px 10px;text-align:center;font-size:13px;color:var(--text-muted)}
    .vm-erro{color:#b91c1c}
    @media (max-width:900px){.content{margin-left:0;padding:18px 14px}.vm-kpis{grid-template-columns:1fr 1fr}.vm-cab,.vm-row{grid-template-columns:1fr}.vm-cab>div:first-child{display:none}.vm-bar input{width:100%}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-button" onclick="logout()" title="Sair"><span class="material-icons-outlined">logout</span> Sair</button>
    </div>
    <ul></ul>
    <div class="sidebar-footer">
      <a href="listagem.html" class="sidebar-button" style="text-decoration:none;"><span class="material-icons-outlined">list_alt</span> Propostas</a>
      <a href="visao-macro.html" class="sidebar-button" style="text-decoration:none;"><span class="material-icons-outlined">timeline</span> Visão macro</a>
      <a href="ajustes.html" class="sidebar-button" style="text-decoration:none;"><span class="material-icons-outlined">tune</span> Ajustes</a>
    </div>
  </aside>

  <main class="content">
    <div class="vm-top">
      <h2>Visão macro do processo</h2>
      <span class="vm-info" id="vm-info"></span>
      <button class="vm-btn" onclick="VM.recarregar()" title="Ler de novo Kommo, PDV, produção e Omie"><span class="material-icons-outlined">refresh</span> Atualizar</button>
    </div>
    <div class="vm-bar">
      <div class="vm-seg"><button id="bt-linha" onclick="VM.modo('linha')">Linha do tempo</button><button id="bt-kanban" onclick="VM.modo('kanban')">Kanban</button></div>
      <select id="vm-vend" onchange="VM.filtrar()"><option value="">Todos os vendedores</option></select>
      <select id="vm-mes" onchange="VM.filtrar()"><option value="">Emitidos em: todos</option></select>
      <input id="vm-busca" type="search" placeholder="Pedido, orçamento ou cliente" oninput="VM.filtrar()" />
    </div>
    <div class="vm-bar">
      <span class="vm-m">Situação</span>
      <button class="vm-chip on" data-sit="" onclick="VM.sit('')">Todos<b>—</b></button>
      <button class="vm-chip" data-sit="atrasado" onclick="VM.sit('atrasado')">Passou do prazo<b>—</b></button>
      <button class="vm-chip" data-sit="parado" onclick="VM.sit('parado')">Parados<b>—</b></button>
      <button class="vm-chip" data-sit="prazo" onclick="VM.sit('prazo')">No prazo<b>—</b></button>
      <button class="vm-chip" data-sit="fim" onclick="VM.sit('fim')">Recebidos<b>—</b></button>
    </div>
    <div class="vm-kpis" id="vm-kpis"></div>
    <div id="vm-corpo"><div class="vm-vazio">Carregando…</div></div>
    <p class="vm-m" style="margin-top:10px">Só leitura: as etapas mudam na Kommo, no PDV, no Sistema de Produção e na Omie. O prazo de cada etapa fica em Ajustes.</p>
  </main>

  <script src="../js/authFetch.js?v=av1"></script>
  <script src="../js/utils.js" defer></script>
  <script src="../js/validarToken.js" defer></script>
  <script src="../js/configuracoes.js?v=pm2"></script>
  <script src="../js/visaoMacro.js?v=vm1"></script>
  <script>document.addEventListener("DOMContentLoaded",()=>{if(typeof verificarTokenOuRedirecionar==="function")verificarTokenOuRedirecionar();});</script>
</body>
</html>
