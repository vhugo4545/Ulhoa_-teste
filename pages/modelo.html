<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos e Fórmulas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/listagem.css">
  <style>
    /* ── Layout ──────────────────────────────────────────────────── */
    body { display: flex; min-height: 100vh; background: var(--primary-light); font-family: 'Poppins', sans-serif; margin: 0; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .sidebar {
      width: 220px; min-width: 220px; background: #0f172a;
      display: flex; flex-direction: column; padding: 24px 0;
      position: fixed; top: 0; left: 0; height: 100vh; z-index: 200;
    }
    .sidebar-logo {
      padding: 0 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.08);
      color: #f1f5f9; font-size: 1rem; font-weight: 700; letter-spacing: 0.5px;
    }
    .sidebar-logo span { color: #94a3b8; font-weight: 400; font-size: 0.78rem; display: block; margin-top: 2px; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; padding: 20px 12px; flex: 1; }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px; color: #94a3b8;
      font-size: 0.85rem; font-weight: 500; text-decoration: none;
      cursor: pointer; border: none; background: none; width: 100%; text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.06); color: #f1f5f9; }
    .sidebar-item.active { background: #1e293b; color: #fff; }
    .sidebar-item .material-icons-outlined { font-size: 19px; }

    /* ── Main ────────────────────────────────────────────────────── */
    .page-body { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

    .topbar {
      background: #fff; border-bottom: 1px solid #e2e8f0;
      padding: 16px 32px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar h1 { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin: 0; }
    .topbar .material-icons-outlined { color: var(--primary); font-size: 22px; }

    .content-area { padding: 32px; flex: 1; }

    /* ── Cards ───────────────────────────────────────────────────── */
    .card-section {
      background: #fff; border-radius: 12px; border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); padding: 24px; margin-bottom: 24px;
    }
    .card-section-title {
      font-size: 0.85rem; font-weight: 600; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 16px;
    }

    /* ── Variáveis ───────────────────────────────────────────────── */
    #variaveisContainer { display: none; }
    #variaveisContainer .form-label { font-size: 0.82rem; font-weight: 500; color: #475569; }
    #variaveisContainer input { font-size: 0.9rem; border-radius: 8px; }

    /* ── Filtro ──────────────────────────────────────────────────── */
    .filtro-wrap { margin-bottom: 20px; }
    .filtro-wrap .form-control { border-radius: 8px; font-size: 0.9rem; border-color: #e2e8f0; }
    .filtro-wrap .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(71,85,105,0.12); }

    /* ── Accordion grupos ────────────────────────────────────────── */
    #produtosAccordion > .accordion-item {
      margin-bottom: 12px; border-radius: 10px !important;
      border: 1px solid #e2e8f0; overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    #produtosAccordion > .accordion-item > .accordion-header .accordion-button {
      font-weight: 600; font-size: 0.95rem; color: #0f172a;
      background: #fff; border-left: 4px solid var(--primary);
    }
    #produtosAccordion > .accordion-item > .accordion-header .accordion-button:not(.collapsed) {
      background: #f1f5f9; color: var(--primary);
    }

    /* ── Accordion produtos (nested) ─────────────────────────────── */
    .accordion-item .accordion-item {
      margin-bottom: 8px; border-radius: 8px !important;
      border: 1px solid #e9eef3 !important;
    }
    .accordion-item .accordion-item .accordion-button {
      font-size: 0.88rem; font-weight: 500; color: #334155; background: #f8fafc;
      border-left: 3px solid #cbd5e1;
    }
    .accordion-item .accordion-item .accordion-button:not(.collapsed) {
      background: #eef2f7; color: #475569;
    }

    /* ── Fórmula / campos ────────────────────────────────────────── */
    textarea.formula {
      font-family: 'Courier New', monospace; font-size: 0.88rem;
      border-radius: 8px; border-color: #e2e8f0; min-height: 36px;
      resize: vertical;
    }
    textarea.formula:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(71,85,105,0.12); outline: none; }
    .form-label { font-weight: 500; font-size: 0.83rem; color: #64748b; }
    .quantidade-desejada {
      background-color: #f1f5f9; font-weight: 600; color: #0f172a;
      border-radius: 8px; border-color: #e2e8f0;
    }

    /* ── Loader ──────────────────────────────────────────────────── */
    #loader { display: none; text-align: center; padding: 48px 0; }

    /* ── Botão Atualizar ─────────────────────────────────────────── */
    #btn-atualizar {
      display: inline-flex; align-items: center; gap: 6px;
      background: #16a34a; color: #fff; border: none;
      padding: 10px 20px; border-radius: 8px; font-family: 'Poppins', sans-serif;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    #btn-atualizar:hover { background: #15803d; }
    #btn-atualizar .material-icons-outlined { font-size: 18px; }
  </style>
  <script src="../js/authFetch.js"></script>
</head>
<body>

  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      Ulhoa<br>
      <span>Gestão de Propostas</span>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-item" href="listagem.html">
        <span class="material-icons-outlined">arrow_back</span>
        Voltar
      </a>
      <div class="sidebar-item active">
        <span class="material-icons-outlined">functions</span>
        Fórmulas
      </div>
      <a class="sidebar-item" href="ajustes.html">
        <span class="material-icons-outlined">settings</span>
        Ajustes
      </a>
    </nav>
  </aside>

  <!-- ── Page body ──────────────────────────────────────────── -->
  <div class="page-body">

    <div class="topbar">
      <span class="material-icons-outlined">functions</span>
      <h1>Produtos e Fórmulas</h1>
    </div>

    <div class="content-area">

      <!-- Variáveis -->
      <div class="card-section" id="variaveisContainer">
        <div class="card-section-title">Variáveis</div>
        <div class="row g-3" id="listaVariaveis"></div>
      </div>

      <!-- Controles -->
      <div class="card-section">
        <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
          <button id="btn-atualizar" onclick="atualizarFormulasNaProposta()">
            <span class="material-icons-outlined">save</span>
            Atualizar Fórmulas
          </button>
          <div class="filtro-wrap" style="flex:1; min-width:200px; margin:0;">
            <input id="filtroGrupo" type="text" class="form-control" placeholder="🔍 Buscar grupo por nome...">
          </div>
        </div>
      </div>

      <!-- Loader -->
      <div id="loader">
        <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;">
          <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="mt-2 fw-semibold" style="color:var(--primary)">Carregando produtos...</p>
      </div>

      <!-- Accordion grupos -->
      <div class="accordion" id="produtosAccordion"></div>

    </div><!-- /content-area -->
  </div><!-- /page-body -->

  <script>
    const ID_PROPOSTA = "68746e305b9691a7ed3b3f97";
    const variaveis = new Map();
    let todasFormulas = [];

    async function carregarProposta() {
      const loader = document.getElementById("loader");
      const variaveisBox = document.getElementById("variaveisContainer");
      loader.style.display = "block";
      variaveisBox.style.display = "none";

      try {
        const resp = await fetch(`https://ulhoa-0a02024d350a.herokuapp.com/api/propostas/${ID_PROPOSTA}`);
        if (!resp.ok) throw new Error("Proposta não encontrada");
        const proposta = await resp.json();

        propostaOriginal = proposta;
        console.log(proposta);
        console.log("testge");
        todasFormulas = [];
        const accordion = document.getElementById("produtosAccordion");
        accordion.innerHTML = "";

        proposta.grupos.forEach((grupo, gIndex) => {
          const grupoId = `grupo-${gIndex}`;
          const grupoHeaderId = `${grupoId}-header`;
          const grupoCollapseId = `${grupoId}-body`;

          const grupoWrapper = document.createElement("div");
          grupoWrapper.className = "accordion-item";

          grupoWrapper.innerHTML = `
            <h2 class="accordion-header" id="${grupoHeaderId}">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#${grupoCollapseId}">
                ${grupo.nome}
              </button>
            </h2>
            <div id="${grupoCollapseId}" class="accordion-collapse collapse" data-bs-parent="#produtosAccordion">
              <div class="accordion-body">
                <div class="accordion" id="accordion-produtos-${grupoId}"></div>
              </div>
            </div>
          `;
          accordion.appendChild(grupoWrapper);

          const produtosContainer = grupoWrapper.querySelector(`#accordion-produtos-${grupoId}`);

          grupo.itens.forEach((item, pIndex) => {
            const formula = item.formula_quantidade || "";
            todasFormulas.push(formula);

            const id = `${grupoId}-produto-${pIndex}`;
            const headerId = `${id}-header`;
            const collapseId = `${id}-body`;

            const card = document.createElement("div");
            card.className = "accordion-item";

            card.innerHTML = `
              <h2 class="accordion-header" id="${headerId}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
                  ${item.nome_produto}
                </button>
              </h2>
              <div id="${collapseId}" class="accordion-collapse collapse" data-bs-parent="#accordion-produtos-${grupoId}">
                <div class="accordion-body">
                  <div class="row g-3 mb-2">
                    <div class="col-md-6">
                      <label class="form-label">Fórmula</label>
                      <textarea class="form-control formula">${formula}</textarea>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label">Quantidade Desejada</label>
                      <input type="number" class="form-control quantidade-desejada" readonly />
                    </div>
                  </div>
                </div>
              </div>
            `;
            produtosContainer.appendChild(card);
          });
        });

        listarVariaveis();
        ativarRecalculoAoSairDasFormulas();
        avaliarTodasFormulas();
        configurarFiltroDeGrupos();

        loader.style.display = "none";
        variaveisBox.style.display = "block";
      } catch (err) {
        loader.innerHTML = `<p class="text-danger">Erro ao carregar proposta: ${err.message}</p>`;
      }
    }

    function listarVariaveis() {
      const todas = todasFormulas.join(" ");
      const encontrados = [...new Set([...todas.matchAll(/#[a-zA-Z0-9_]+/g)].map(m => m[0]))];

      const lista = document.getElementById("listaVariaveis");
      lista.innerHTML = "";

      encontrados.forEach(nome => {
        const col = document.createElement("div");
        col.className = "col-md-2";
        col.innerHTML = `
          <label class="form-label">${nome}</label>
          <input type="number" class="form-control input-sm" data-var="${nome}" value="${variaveis.get(nome) ?? ""}">
        `;
        lista.appendChild(col);
      });

      lista.querySelectorAll("input").forEach(input => {
        ["input", "blur"].forEach(evento => {
          input.addEventListener(evento, () => {
            const nome = input.dataset.var;
            const valor = parseFloat(input.value);
            variaveis.set(nome, isNaN(valor) ? null : valor);
            avaliarTodasFormulas();
          });
        });
      });
    }

    function ativarRecalculoAoSairDasFormulas() {
      document.querySelectorAll("textarea.formula").forEach(textarea => {
        textarea.addEventListener("blur", () => {
          avaliarTodasFormulas();
        });
      });
    }

    function avaliarTodasFormulas() {
      document.querySelectorAll("textarea.formula").forEach((textarea) => {
        const formulaRaw = textarea.value;
        const campoQtd = textarea.closest(".accordion-body").querySelector(".quantidade-desejada");

        let resultado = "";
        try {
          const expr = formulaRaw.replace(/#[a-zA-Z0-9_]+/g, match => {
            const v = variaveis.get(match);
            if (v == null) throw `Variável ${match} indefinida`;
            return v;
          });
          const val = eval(expr);
          resultado = isNaN(val) ? "" : parseFloat(val).toFixed(2);
        } catch (err) {
          resultado = "";
        }

        campoQtd.value = resultado;
      });

      console.log("🔁 Fórmulas reavaliadas:", Object.fromEntries(variaveis));
    }

    function configurarFiltroDeGrupos() {
      const inputFiltro = document.getElementById("filtroGrupo");
      inputFiltro.addEventListener("input", () => {
        const termo = inputFiltro.value.toLowerCase().trim();
        const grupos = document.querySelectorAll("#produtosAccordion > .accordion-item");

        grupos.forEach(grupo => {
          const titulo = grupo.querySelector(".accordion-button")?.textContent?.toLowerCase() || "";
          grupo.style.display = titulo.includes(termo) ? "" : "none";
        });
      });
    }

    document.addEventListener("DOMContentLoaded", carregarProposta);

    async function atualizarFormulasNaProposta() {
      try {
        mostrarCarregando();

        const idProposta = ID_PROPOSTA;

        if (!propostaOriginal) {
          throw new Error("Proposta original não carregada.");
        }

        const novaProposta = JSON.parse(JSON.stringify(propostaOriginal));

        novaProposta.grupos.forEach((grupo, gIndex) => {
          const grupoId = `grupo-${gIndex}`;
          const produtos = document.querySelectorAll(`#accordion-produtos-${grupoId} .accordion-item`);

          produtos.forEach((produtoCard, pIndex) => {
            const formulaTextarea = produtoCard.querySelector("textarea.formula");
            const formula = formulaTextarea?.value?.trim() || "";

            let quantidade_desejada = null;
            try {
              const expr = formula.replace(/#[a-zA-Z0-9_]+/g, match => {
                const inputVar = document.querySelector(`[data-var="${match}"]`);
                if (!inputVar) throw `Variável ${match} não encontrada`;
                const valor = parseFloat(inputVar.value);
                if (isNaN(valor)) throw `Valor inválido para ${match}`;
                return valor;
              });
              const val = eval(expr);
              quantidade_desejada = isNaN(val) ? null : parseFloat(val.toFixed(2));
            } catch {
              quantidade_desejada = null;
            }

            const item = grupo.itens[pIndex];
            if (item) {
              item.formula_quantidade = formula;
              item.quantidade_desejada = quantidade_desejada;
            }
          });
        });

        const payload = {
          tipoProposta:     novaProposta.tipoProposta,
          numeroProposta:   novaProposta.numeroProposta,
          numeroPedido:     novaProposta.numeroPedido,
          camposFormulario: novaProposta.camposFormulario,
          grupos:           novaProposta.grupos,
        };
        const resp = await fetch(`https://ulhoa-0a02024d350a.herokuapp.com/api/propostas/${idProposta}`, {
          method: "PUT",
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await resp.json();
        console.log("✅ Apenas fórmulas atualizadas:", result);

        mostrarPopupCustomizado("✅ Fórmulas Atualizadas", "As fórmulas foram salvas com sucesso.", "success");
      } catch (err) {
        console.error("❌ Erro ao salvar fórmulas:", err);
        mostrarPopupCustomizado("❌ Erro", "Erro ao salvar fórmulas.", "error");
      } finally {
        ocultarCarregando();
      }
    }

    document.querySelectorAll('.sidebar-button').forEach(btn => {
      btn.addEventListener('click', function(evt) {
        if (btn.disabled) {
          console.warn('Clique duplo detectado e bloqueado em:', btn);
          evt.stopImmediatePropagation();
          evt.preventDefault();
          return false;
        }
        console.log('Clique aceito, bloqueando botão por 2 segundos:', btn);
        btn.disabled = true;
        setTimeout(() => btn.disabled = false, 2000);
      }, true);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/carregamento.js"></script>
  <script src="../js/envioOmie.js"></script>
</body>
</html>
