<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proposta com Inputs e Tabela</title>

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="../css/listagem.css" />
  <script src="../js/authFetch.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

</head>

<body>
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <ul>
    
      <li><a href="../pages/listagem.html"><span class="material-icons-outlined">list</span> Início</a></li>
     
    </ul>
    <button id="btn-criar" class="sidebar-button" onclick="salvarPropostaEditavel() ">
      <span class="material-icons-outlined">add_circle_outline</span> Criar Proposta
    </button>
<br>

    <button id="btn-solicitar" class="sidebar-button" onclick="marcarPendenteAprovacao()">
      <span class="material-icons-outlined">assignment_turned_in</span> Solicitar Aprovação
    </button>

    <button id="btn-autorizar" class="sidebar-button" onclick="marcarAprovadoPeloGestor()">
      <span class="material-icons-outlined">verified_user</span> Aprovar ( Gestor )
    </button>

    <button id="btn-enviar" class="sidebar-button" onclick="irParaPagina('enviarProposta.html')">
      <span class="material-icons-outlined">send</span> Enviar Proposta
    </button>

    <button id="btn-gerar-pedido" class="sidebar-button" onclick="irParaPagina('gerarPedidoVenda.html')">
      <span class="material-icons-outlined">receipt_long</span> Gerar Pedido de Venda
    </button>
    </div>

  </aside>



  <!-- CONTEÚDO PRINCIPAL -->
  <main class="content">
    <div class="main-container">
      <form id="novoOrcamentoForm">
        <div class="accordion mb-3" id="accordionOrcamento">

          <!-- Aba: Informações do Orçamento -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseInfoOrcamento">
                Informações do Orçamento
              </button>
            </h2>
            <div id="collapseInfoOrcamento" class="accordion-collapse collapse show">
              <div class="accordion-body">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label">Número do Orçamento</label>
                    <input type="text" class="form-control" id="numeroOrcamento" readonly tabindex="-1" style="background-color: #e6e6e6; color: #000;">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Data do Orçamento</label>
                    <input type="date" class="form-control" id="dataOrcamento" required>
                  </div>
                 <div class="col-md-4" style="display:none">
  <label class="form-label">Origem do Cliente</label>
  <select class="form-select" id="origemCliente">
    <option value="">Selecione</option>
    <option>Google</option>
    <option>Instagram</option>
    <option>Facebook</option>
    <option>Site</option>
    <option>Arquiteto(a)</option>
    <option>Construtora</option>
    <option>Engenheiro(a)</option>
    <option>Indicação (boca a boca)</option>
    <option>Licitação</option>
  </select>
</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Aba: Dados do Cliente -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseCliente">
                Dados do Cliente
              </button>
            </h2>
            <div id="collapseCliente" class="accordion-collapse collapse">
              <div class="accordion-body">
                <div id="clientesWrapper">
                  <div class="row g-3 cliente-item">
                    <div class="col-md-6 position-relative d-flex align-items-end gap-2">
                      <div class="flex-grow-1">
                        <label class="form-label">Nome / Razão Social</label>
                        <input type="text" class="form-control razaoSocial" placeholder="Digite para buscar..."
                          autocomplete="off">
                        <ul class="sugestoesCliente list-group position-absolute w-100 shadow bg-white"
                          style="z-index: 10; max-height: 200px; overflow-y: auto; display: none;"></ul>
                      </div>
                      <button type="button" class="btn btn-outline-success rounded-circle" title="Incluir Cliente"
                        onclick="abrirPopupIncluirCliente()"
                        style="height: 38px; width: 38px; display: flex; align-items: center; justify-content: center;">
                        <strong>+</strong>
                      </button>
                    </div>

                    <div class="col-md-6">
                      <label class="form-label">Código Omie</label>
                    <input type="text" class="form-control codigoCliente" readonly tabindex="-1" style="background-color: #dfdfe0; color: #000;">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">CPF / CNPJ</label>
                      <input type="text" class="form-control cpfCnpj" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Nome do Contato</label>
                      <input type="text" class="form-control nomeContato">
                    </div>
                    <div class="col-md-6">
  <label class="form-label">Função / Cargo</label>
  <input type="text" class="form-control funcaoCliente" list="funcaoOptions" placeholder="Selecione ou digite">
  <datalist id="funcaoOptions">
    <option value="Cliente">
    <option value="Fornecedor">
    <option value="Transportadora">
    <option value="Funcionário">
    <option value="Arquiteto(a)">
    <option value="Construtora">
    <option value="Engenheiro(a)">
    <option value="Influenciador(a)">
    <option value="Indicador(a) de Clientes">
    <option value="Gerenciadora de Obra">
    <option value="Condomínio / Administradora">
    <option value="Investidor(a) (constrói para vender)">
    <option value="Órgão Público">
    <option value="Empresa / Comércio">
    <option value="Contato Estratégico MKT">
  </datalist>
</div>
                    <div class="col-md-6">
                      <label class="form-label">Telefone</label>
                      <input type="text" class="form-control telefoneCliente">
                    </div>
                  </div>
                </div>
                <button type="button" class="btn btn-outline-primary mt-2"
                  onclick="adicionarClienteRelacionado()">Adicionar Cliente Relacionado</button>
                  <button type="button" class="btn btn-outline-danger btn-sm" onclick="abrirPopupExcluirClienteRelacionado()">
  Excluir cliente relacionado
</button>

              </div>
            </div>
          </div>







          <!-- Modal de Incluir Cliente -->
          <!-- Modal de Incluir Cliente -->




          <!-- Aba: Endereço da Obra -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseEndereco">
                Endereço da Obra
              </button>
            </h2>
            <div id="collapseEndereco" class="accordion-collapse collapse">
              <div class="accordion-body">
                <div class="row g-3">
                  <div class="col-md-3"><label class="form-label">CEP</label><input type="text" class="form-control"
                      id="cep"></div>
                  <div class="col-md-6"><label class="form-label">Rua / Avenida</label><input type="text"
                      class="form-control" id="rua"></div>
                  <div class="col-md-3"><label class="form-label">Número</label><input type="text" class="form-control"
                      id="numero"></div>
                  <div class="col-md-4"><label class="form-label">Complemento</label><input type="text"
                      class="form-control" id="complemento"></div>
                  <div class="col-md-4"><label class="form-label">Bairro</label><input type="text" class="form-control"
                      id="bairro"></div>
                  <div class="col-md-2"><label class="form-label">Cidade</label><input type="text" class="form-control"
                      id="cidade"></div>
                  <div class="col-md-2"><label class="form-label">Estado</label><input type="text" class="form-control"
                      id="estado"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Aba: Equipe Interna -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseEquipe">
                Equipe Interna
              </button>
            </h2>
            <div id="collapseEquipe" class="accordion-collapse collapse">
              <div class="accordion-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Vendedor Responsável</label>
                    <select class="form-select" id="vendedorResponsavel" required>
                      <option value="">Carregando...</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Operador (Usuário Interno)</label>
                    <input type="text" class="form-control" id="operadorInterno">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Aba: Produtos, Condições e Prazos -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseProdutos">
                Produtos, Prazos e Condições
              </button>
            </h2>
            <div id="collapseProdutos" class="accordion-collapse collapse">
              <div class="accordion-body" style="padding:0;font-family:'Poppins',sans-serif;">

                <!-- Prazos por Área -->
                <div style="padding:22px 26px;border-bottom:1px solid #f1f5f9;">
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin-bottom:12px;">Prazos por Área</div>
                  <textarea class="form-control" id="prazosArea" rows="4" placeholder="Área ___: ___ dias úteis após aprovação..." style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;resize:vertical;"></textarea>
                </div>

                <!-- Condição de Pagamento -->
                <div style="padding:22px 26px;border-bottom:1px solid #f1f5f9;">
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin-bottom:12px;">Condição de Pagamento</div>
                  <select class="form-select" id="condicaoPagamento" style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
                    <option value="">Selecione</option>
                    <option value="debito_40_40_20">40% de entrada, 40% após 30 dias e 20% após 60 dias.</option>
                    <option value="debito_40_30_30">40% de entrada, 30% após 30 dias e 30% após 60 dias.</option>
                    <option value="debito_60_40">60% de entrada, 40% após 30 dias.</option>
                    <option value="parcelado">Personalizado</option>
                  </select>
                </div>

                <!-- Parcelas -->
                <div id="parcelamentoContainer" style="padding:22px 26px;border-bottom:1px solid #f1f5f9;display:none;">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;">Parcelas</div>
                    <button type="button" onclick="adicionarParcela()" style="display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;color:#475569;cursor:pointer;">
                      <span style="font-size:15px;line-height:1;">+</span> Adicionar Parcela
                    </button>
                  </div>
                  <div id="listaParcelas" style="display:flex;flex-direction:column;gap:10px;"></div>
                  <div style="margin-top:14px;padding:10px 16px;background:#f8fafc;border-radius:8px;border:1px solid #f1f5f9;font-size:13px;color:#475569;font-weight:600;">
                    Total das parcelas: <span id="totalParcelas" style="color:#0f172a;">R$ 0,00</span>
                  </div>
                </div>

                <!-- Condições Gerais -->
                <div style="padding:22px 26px;">
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin-bottom:12px;">Condições Gerais</div>
                  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
                    <button type="button" onclick="preencherCondicoesComInstalacao()" style="padding:6px 14px;border:1px solid #cbd5e1;border-radius:20px;background:#fff;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;color:#475569;cursor:pointer;">Com medição e instalação</button>
                    <button type="button" onclick="preencherCondicoesSemInstalacao()" style="padding:6px 14px;border:1px solid #cbd5e1;border-radius:20px;background:#fff;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;color:#475569;cursor:pointer;">Sem medição e instalação</button>
                    <button type="button" onclick="preencherCondicoesSemTampo()" style="padding:6px 14px;border:1px solid #cbd5e1;border-radius:20px;background:#fff;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;color:#475569;cursor:pointer;">Sem tampo</button>
                  </div>
                  <textarea class="form-control" id="condicoesGerais" rows="10" placeholder="Escolha uma opção ou edite manualmente..." style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;resize:vertical;"></textarea>
                </div>

              </div>
            </div>
          </div>
<!-- Aba NOVA: Acompanhamento (Pedido/Obra/Projeto) -->
<div class="accordion-item">
  <h2 class="accordion-header" id="headingAbaObraPedido">
    <button class="accordion-button collapsed" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#collapseAbaObraPedido"
      aria-expanded="false"
      aria-controls="collapseAbaObraPedido">
      Acompanhamento do Pedido, Obra e Projeto
    </button>
  </h2>

  <div id="collapseAbaObraPedido"
    class="accordion-collapse collapse"
    aria-labelledby="headingAbaObraPedido"
    data-bs-parent="#accordionProposta">
    <div class="accordion-body">

      <div class="mb-3">
        <label class="form-label">Prazo de entrega</label>
        <input type="text" class="form-control" id="prazoEntrega" placeholder="Ex.: 20 dias úteis após aprovação">
      </div>

      <div class="mb-3">
        <label class="form-label">Data que o pedido foi enviado para o cliente</label>
        <input type="date" class="form-control" id="dataPedidoEnviadoCliente">
      </div>

      <div class="mb-3">
        <label class="form-label">Por onde foi enviado</label>
        <input type="text" class="form-control" id="meioEnvioPedido" placeholder="Ex.: WhatsApp, e-mail, presencial...">
      </div>

      <div class="mb-3">
        <label class="form-label">Data que o pedido foi assinado</label>
        <input type="date" class="form-control" id="dataPedidoAssinado">
      </div>

      <div class="mb-3">
        <label class="form-label">Obra está liberada?</label>
        <select class="form-select" id="obraLiberada">
          <option value="">Selecione</option>
          <option value="sim">Sim</option>
          <option value="nao">Não</option>
          <option value="parcial">Parcial</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Quais itens / observações sobre a liberação</label>
        <textarea class="form-control" id="itensLiberacaoObra" rows="4"
          placeholder="Descreva quais itens estão liberados, pendências, restrições, etc."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Data da liberação da obra</label>
        <input type="date" class="form-control" id="dataLiberacaoObra">
      </div>

      <div class="mb-3">
        <label class="form-label">Data do projeto enviado</label>
        <input type="date" class="form-control" id="dataProjetoEnviado">
      </div>

      <div class="mb-3">
        <label class="form-label">Data do projeto assinado</label>
        <input type="date" class="form-control" id="dataProjetoAssinado">
      </div>

      <div class="mb-3">
        <label class="form-label">Data da medição realizada</label>
        <input type="date" class="form-control" id="dataMedicaoRealizada">
      </div>

    </div>
  </div>
</div>

        </div>
      </form>
      <div class="d-flex justify-content-center my-4 position-relative">
        <div class="d-flex flex-column align-items-center w-100" style="max-width: 600px;">
          <div class="input-group input-group-lg shadow w-100">
            <input id="buscaProduto" type="text" class="form-control text-center"
              placeholder="Pesquisar produto, cliente ou proposta..." autocomplete="off">
            <button class="btn btn-primary d-flex align-items-center gap-2 px-4" type="button">
              <span class="material-icons-outlined">search</span>
              <span>Buscar</span>
            </button>
          </div>

          <button id="fecharSanfonasBtn" class="btn btn-outline-secondary btn-sm w-100 mt-2"
            onclick="fecharTodasSanfonas()">
            🔽 Fechar todos os blocos
          </button>

          <button id="abrirSanfonasBtn" class="btn btn-outline-primary btn-sm w-100 mt-2"
            onclick="abrirTodasSanfonas()">
            🔼 Abrir todos os blocos
          </button>



          <ul id="sugestoesProdutos" class="list-group position-absolute w-100 shadow bg-white mt-2"
            style="z-index: 10; top: 100%; display: none; max-height: 200px; overflow-y: auto;"></ul>
        </div>
      </div>


      <div class="col-lg-12" id="blocosProdutosContainer">
        <!-- Blocos dinâmicos de produtos serão adicionados aqui -->
      </div>
    </div>
    <br>
    <br>
    <br>
    <br>


  </main>
  <!-- Modal de Incluir Cliente -->
<div class="modal fade" id="popupClienteModal" tabindex="-1" aria-labelledby="popupClienteLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="border:none;border-radius:16px;overflow:hidden;font-family:'Poppins',sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.18);">

      <div class="modal-header" style="background:#0f172a;border:none;padding:20px 28px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="material-icons-outlined" style="color:#94a3b8;font-size:20px;">person_add</span>
          <h5 class="modal-title" id="popupClienteLabel" style="margin:0;font-size:15px;font-weight:700;color:#f1f5f9;">Incluir Cliente</h5>
        </div>
        <button type="button" class="btn-close btn-close-white" onclick="confirmarFecharModalCliente()" aria-label="Fechar"></button>
      </div>

      <div class="modal-body" style="padding:28px;background:#fff;">
        <form id="popupCliente_form">
          <input type="hidden" id="popupCliente_codigo">

          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:14px;">Identificação</div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label" style="font-size:12px;font-weight:600;color:#475569;">CNPJ ou CPF *</label>
              <input type="text" class="form-control" id="popupCliente_cnpjcpf" required style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
            </div>
            <div class="col-md-6">
              <label class="form-label" style="font-size:12px;font-weight:600;color:#475569;">Razão Social *</label>
              <input type="text" class="form-control" id="popupCliente_razao" required style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
            </div>
            <div class="col-md-6">
              <label class="form-label" style="font-size:12px;font-weight:600;color:#475569;">Nome Fantasia *</label>
              <input type="text" class="form-control" id="popupCliente_fantasia" required style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
            </div>
            <div class="col-md-6">
              <label class="form-label" style="font-size:12px;font-weight:600;color:#475569;">E-mail *</label>
              <input type="email" class="form-control" id="popupCliente_email" required style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
            </div>
          </div>

          <hr style="border-color:#f1f5f9;margin:20px 0;">

          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:14px;">Endereço</div>
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label class="form-label" style="font-size:12px;font-weight:600;color:#475569;">Endereço *</label>
              <input type="text" class="form-control" id="popupCliente_endereco" required style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
            </div>
            <div class="col-md-6">
              <label class="form-label" style="font-size:12px;font-weight:600;color:#475569;">Bairro *</label>
              <input type="text" class="form-control" id="popupCliente_bairro" required style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
            </div>
            <div class="col-md-6">
              <label class="form-label" style="font-size:12px;font-weight:600;color:#475569;">Cidade *</label>
              <input type="text" class="form-control" id="popupCliente_cidade" required style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:12px;font-weight:600;color:#475569;">Estado (UF) *</label>
              <select class="form-control" id="popupCliente_estado" required style="border-radius:8px;border-color:#e2e8f0;font-size:13px;font-family:'Poppins',sans-serif;">
                <option value="">Selecione...</option>
                <option>AC</option><option>AL</option><option>AM</option><option>AP</option>
                <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                <option>GO</option><option>MA</option><option>MG</option><option>MS</option>
                <option>MT</option><option>PA</option><option>PB</option><option>PE</option>
                <option>PI</option><option>PR</option><option>RJ</option><option>RN</option>
                <option>RO</option><option>RR</option><option>RS</option><option>SC</option>
                <option>SE</option><option>SP</option><option>TO</option>
              </select>

function observarEPreencherOperadorInterno() {
  const nome = localStorage.getItem("usuarioNome");
  if (!nome) return;

  const tentarPreencher = () => {
    const campo = document.getElementById("operadorInterno");
    if (campo && campo.value.trim() === "") {
      campo.value = nome;
      console.log("✅ Campo #operadorInterno preenchido com:", nome);
      observer.disconnect(); // para de observar
    }
  };

  const observer = new MutationObserver(tentarPreencher);

  observer.observe(document.body, {
    childList: true,
    subtree: true,
  });

  tentarPreencher(); // tenta imediatamente também
}

document.addEventListener("DOMContentLoaded", () => {
  setTimeout(observarEPreencherOperadorInterno, 3000); // espera 3 segundos
});


</script>

<!-- Barra sticky: Orçamento + Pedido -->
<div id="sticky-numeros" style="
  display:none;
  position:fixed;
  top:0; left:0; right:0;
  z-index:9999;
  background:#1e293b;
  color:#fff;
  font-size:14px;
  font-weight:600;
  padding:8px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  pointer-events:none;
  gap:24px;
  align-items:center;
  justify-content:center;
  letter-spacing:.02em;
">
  <span>Orçamento: <span id="sticky-orc" style="color:#93c5fd;">—</span></span>
  <span style="opacity:.35;">|</span>
  <span>Pedido: <span id="sticky-ped" style="color:#93c5fd;">—</span></span>
</div>
<script>
(function() {
  var bar = document.getElementById("sticky-numeros");

  function sync() {
    var orc = document.getElementById("numeroOrcamento")?.value || "—";
    var ped = document.getElementById("numeroPedido")?.value || "—";
    document.getElementById("sticky-orc").textContent = orc;
    document.getElementById("sticky-ped").textContent = ped;
  }

  var sentinel = document.getElementById("numeroOrcamento");
  var observer = new IntersectionObserver(function(entries) {
    var visivel = entries[0].isIntersecting;
    bar.style.display = visivel ? "none" : "flex";
    if (!visivel) sync();
  }, { threshold: 0 });

  if (sentinel) observer.observe(sentinel);

  setInterval(function() {
    if (bar.style.display !== "none") sync();
  }, 500);
})();
</script>
